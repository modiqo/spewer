[package]
name = "spewer"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "Apache-2.0"
description = "A durable supervisor for bounded work delegated to cheaper agent harnesses"
repository = "https://github.com/tulving/spewer"
publish = false

[dependencies]
lexopt = "=0.3.2"
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = { version = "=0.11.0", default-features = false }
time = { version = "=0.3.55", default-features = false, features = ["formatting", "std"] }
tokio = { version = "=1.53.1", default-features = false, features = ["io-util", "macros", "process", "rt", "signal", "sync", "time"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "=0.31.3", default-features = false, features = ["process", "signal"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"

