name: pages

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/pages.yml"
      - "site/**"
      - "assets/tutorial/01-what-spewer-does.png"
      - "docs/assets/how-it-works/06-pluggable-ends.png"
      - "docs/assets/how-it-works/07-connected-use-case-cp18.png"
      - "docs/assets/how-it-works/08-user-experience.png"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - name: Check out release source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Assemble static site
        run: |
          mkdir -p _site/assets
          cp -R site/. _site/
          cp assets/tutorial/01-what-spewer-does.png _site/assets/spewer-delegation.png
          cp docs/assets/how-it-works/06-pluggable-ends.png _site/assets/pluggable-ends.png
          cp docs/assets/how-it-works/07-connected-use-case-cp18.png _site/assets/connected-use-case.png
          cp docs/assets/how-it-works/08-user-experience.png _site/assets/user-experience.png

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: _site

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
